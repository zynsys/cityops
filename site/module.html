<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop Module — Learn GitHub Copilot with a Real-World App</title>
    <meta name="description" content="Explore a CityOps GitHub Copilot workshop module and its lessons." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="module.css" />
    <link rel="stylesheet" href="light-theme.css" />
    <script src="theme-toggle.js"></script>
    <script src="workshop-data.js"></script>
  </head>
  <body>
    <div class="module-toolbar">
      <a href="index.html" class="module-home-link">← All modules</a>
      <button class="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
    </div>

    <main class="module-page">
      <div class="container">
        <header class="module-hero" id="moduleHero"></header>
        <section class="module-lessons" aria-labelledby="lessonsTitle">
          <div class="module-section-heading">
            <div>
              <span class="module-eyebrow">Learning path</span>
              <h2 id="lessonsTitle">Module lessons</h2>
            </div>
            <span class="module-lesson-total" id="lessonTotal"></span>
          </div>
          <ol class="module-lesson-list" id="lessonList"></ol>
        </section>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const requestedModule = params.get('module');
      const module =
        window.WORKSHOP_MODULES.find((candidate) => candidate.id === requestedModule) ?? window.WORKSHOP_MODULES[0];

      document.title = `${module.title} — Learn GitHub Copilot with a Real-World App`;
      document.getElementById('moduleHero').innerHTML = `
        <span class="module-hero-icon" aria-hidden="true">${module.icon}</span>
        <span class="module-eyebrow">Workshop module</span>
        <h1>${module.title}</h1>
        <p class="module-summary">${module.summary}</p>
        <p class="module-description">${module.description}</p>
        <a class="btn btn-primary" href="step.html?step=${module.lessons[0].id}">Start module →</a>
      `;
      document.getElementById('lessonTotal').textContent = `${module.lessons.length} lessons`;
      document.getElementById('lessonList').innerHTML = module.lessons
        .map(
          (lesson, index) => `
            <li>
              <a class="module-lesson-card" href="step.html?step=${lesson.id}">
                <span class="module-lesson-number">${String(index + 1).padStart(2, '0')}</span>
                <span class="module-lesson-copy">
                  <strong>${lesson.title}</strong>
                  <span>${lesson.description}</span>
                </span>
                <span class="module-lesson-duration">${lesson.duration}</span>
              </a>
            </li>
          `,
        )
        .join('');
    </script>
  </body>
</html>
