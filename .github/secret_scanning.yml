# CityOps secret scanning configuration.
#
# GitHub secret scanning is enabled at the repository level (Settings → Code security);
# this file only TUNES it. The single supported key is `paths-ignore`, a list of globs
# whose matches are excluded from secret scanning ALERTS.
#
# Scope and limits — read before adding an entry:
#   - This does NOT weaken push protection. A real provider-issued credential pushed to an
#     ignored path is still blocked at the push. Only the alert is suppressed.
#   - Maximum 1000 patterns, and only `paths-ignore` is honoured. Any other key is ignored
#     silently, so a typo'd key fails open rather than erroring.
#   - Changes take effect from the default branch (main), so this file must be merged before
#     it applies.
#
# The entries below are limited to paths that hold KNOWN-FAKE credentials — seed data, test
# fixtures, and documentation placeholders. Every one of them produced, or would produce, a
# false positive that buries real findings. Do not add application source, infrastructure,
# or CI workflow paths here: those are exactly where a leaked credential would matter.
paths-ignore:
  # Seed data. `prisma/seed.ts` hardcodes a shared demo password for the local/dev fixture
  # users so `npm run db:seed` produces a signed-in-able environment.
  - 'prisma/seed.ts'
  - 'prisma/seed/**'

  # Unit and integration fixtures. Auth validation tests assert on deliberately weak and
  # deliberately invalid passwords, and MSW handlers stub bearer tokens for the Azure
  # adapters in src/lib.
  - 'src/__tests__/**'

  # Playwright specs sign in as the seeded fixture users, so they repeat the same demo
  # credentials as prisma/seed.ts.
  - 'e2e/**'

  # Deployment documentation. docs/deployment-guidelines.md shows `openssl rand` invocations
  # and explicitly throwaway values (e.g. the validate-only Bicep parameters) as copyable
  # examples; they are illustrative strings, not issued credentials.
  - 'docs/**'

  # Workshop curriculum. The training site walks learners through generating AUTH_SECRET and
  # wiring a local .env, using placeholder values throughout.
  - 'workshop/content/**'

# Deliberately NOT ignored:
#   - `.env.example` — it is the template every real `.env` is copied from, so a genuine
#     secret pasted there is a plausible mistake and one we want flagged loudly.
#   - `infra/**` — Bicep parameters and outputs must stay under scanning; secrets belong in
#     Key Vault, and an inlined one is a finding, not noise.
#   - `.github/workflows/**` — credentials there must come from GitHub secrets or OIDC.
