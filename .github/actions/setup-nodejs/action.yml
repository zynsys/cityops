# Shared setup: install the pinned Node.js version then run `npm ci`.
# Mirrors .ado/templates/setup-nodejs.yml — centralises toolchain setup for every job.
name: 'Setup Node'
description: 'Install pinned Node.js and project dependencies'
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22.x'
  install-display-name:
    description: 'Label for the install step (informational only)'
    required: false
    default: 'Install dependencies'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    - name: ${{ inputs.install-display-name }}
      shell: bash
      run: bash scripts/npm-ci.sh
