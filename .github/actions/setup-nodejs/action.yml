# Shared setup: install the pinned Node.js version then run `npm ci`.
# Mirrors .ado/templates/setup-nodejs.yml — centralises toolchain setup for every job.
name: 'Setup Node'
description: 'Install pinned Node.js and project dependencies'
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22.x'
  install-display-name:
    description: 'Label for the install step (informational only)'
    required: false
    default: 'Install dependencies'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    - name: ${{ inputs.install-display-name }}
      shell: bash
      run: |
        set -e
        n=0
        until npm ci; do
          n=$((n + 1))
          # Retries transient registry errors (e.g. a 503 from the npm feed) — a real
          # lockfile/dependency error fails identically on every attempt, so this only adds
          # delay in that case, not a false pass.
          [ "$n" -ge 3 ] && exit 1
          echo "npm ci failed (attempt $n/3) — retrying in 15s..."
          sleep 15
        done
