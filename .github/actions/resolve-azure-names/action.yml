# Shared step: derive the web app / key vault names by naming convention (deterministic — see
# docs/deployment-guidelines.md §5.3, the "no hardcoding" mechanism). Existence is already
# verified by the verify_azure_env job (.github/actions/verify-azure-resources) before deploy_dev/
# deploy_prod ever run, so this is just a plain string computation — no az CLI/auth needed here.
# Mirrors .ado/templates/resolve-azure-names.yml.
name: 'Resolve Azure resource names'
description: 'Resolve web app / key vault names by naming convention'
inputs:
  base-name:
    required: false
    default: 'cityops'
outputs:
  web-app-name:
    description: 'Resolved App Service name'
    value: ${{ steps.resolve.outputs.web_app_name }}
  key-vault-name:
    description: 'Resolved Key Vault name'
    value: ${{ steps.resolve.outputs.key_vault_name }}
runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      run: |
        set -e
        eval "$(bash scripts/app/resolve-azure-names.sh '${{ inputs.base-name }}')"
        echo "web_app_name=$WEB_APP_NAME" >> "$GITHUB_OUTPUT"
        echo "key_vault_name=$KEY_VAULT_NAME" >> "$GITHUB_OUTPUT"
