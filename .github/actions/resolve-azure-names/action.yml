# Shared step: derive the web app / key vault names by naming convention instead of storing
# them anywhere (see docs/deployment-guidelines.md §5.3 — the "no hardcoding" mechanism).
# Mirrors .ado/templates/resolve-azure-names.yml. Names are deterministic (main.bicep no longer
# appends a uniqueString suffix), so this is a plain string computation — no azure/login needed.
name: 'Resolve Azure resource names'
description: 'Resolve web app / key vault names by naming convention'
inputs:
  base-name:
    required: false
    default: 'cityops'
outputs:
  web-app-name:
    description: 'Resolved App Service name'
    value: ${{ steps.resolve.outputs.web_app_name }}
  key-vault-name:
    description: 'Resolved Key Vault name'
    value: ${{ steps.resolve.outputs.key_vault_name }}
runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      run: |
        set -e
        echo "web_app_name=app-${{ inputs.base-name }}" >> "$GITHUB_OUTPUT"
        echo "key_vault_name=kv-${{ inputs.base-name }}" >> "$GITHUB_OUTPUT"
