# Standalone step: post-deploy APPLICATION smoke test — curl the given URL with retries (covers
# cold start), HARD-fail if it never returns 200. Distinct from the infra workflow's smoke_test
# job (which checks Azure resource provisioning state, not application code): this confirms the
# code that was JUST deployed is actually serving traffic. Mirrors .ado/templates/smoke-test.yml.
name: 'Smoke test'
description: 'Curl a URL with retries; hard-fail if it never returns 200'
inputs:
  url:
    required: true
  # Defaults allow ~6-10 min: a Next.js standalone cold start after deploy can take several minutes.
  max-attempts:
    required: false
    default: '24'
  retry-delay-seconds:
    required: false
    default: '10'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: bash scripts/app/smoke-test.sh '${{ inputs.url }}' '${{ inputs.max-attempts }}' '${{ inputs.retry-delay-seconds }}'
