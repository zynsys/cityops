# CityOps CodeQL — ADVANCED setup (replaces GitHub's default CodeQL setup).
#
# PREREQUISITE: default setup must be turned off before this workflow can upload results,
# otherwise the analyze step fails with "CodeQL default setup is enabled". Go to
#   Settings → Advanced Security → Code scanning → CodeQL analysis → ⋯ → Switch to advanced
# and confirm. Merging this file alone is not enough.
#
# Why advanced setup here:
#   - Pins the query suite (security-extended) and path exclusions in
#     .github/codeql/codeql-config.yml, reviewed like any other code.
#   - Adds the 'actions' language so our own workflows are scanned for injection and
#     untrusted-checkout issues alongside the app's TypeScript.
#   - Lets us control triggers, concurrency and timeouts instead of GitHub's defaults.
#
# Both languages use build-mode 'none': javascript-typescript is interpreted and the
# 'actions' analyzer only reads YAML, so no npm install / next build is needed. Do NOT add
# a build step "to be safe" — it doubles run time and changes nothing in the results.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan. Catches newly published queries against unchanged code — a file
    # that was clean last month can be flagged by a query shipped this week.
    - cron: "37 16 * * 2"
  workflow_dispatch: {}

# NOTE: intentionally no paths-ignore on the triggers above. Code scanning results gate PR
# merges, and a skipped workflow never reports its check. File-level scoping is done in the
# CodeQL config file instead, which filters inside the analysis rather than skipping it.

# Least privilege at workflow level; the analyze job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Superseded PR pushes are cancelled; main and scheduled scans always run to completion
  # so the Security tab's baseline is never left stale by a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload SARIF to the Security tab
      packages: read # fetch CodeQL query packs
      actions: read # read workflow run metadata (required in private repos)
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Scans .github/workflows and .github/actions for workflow-level vulnerabilities.
          - language: actions
            build-mode: none
          # Covers the Next.js app, Prisma queries/mutations and the workshop site.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Keeps each language's results in its own SARIF category so one language's run
          # never overwrites the other's alerts.
          category: "/language:${{ matrix.language }}"
