# CityOps CI/CD — build + test pyramid, then deploy dev (auto) → prod (manual + approval).
# GitHub Actions equivalent of .ado/app-cicd.yml.
# Unit + integration gate every push/PR; e2e runs on PRs, nightly, and manual runs only.
#
# PREREQUISITES (one-time — run scripts/setup-github.sh; see
# docs/deployment/github-actions-setup.md):
#   1. Separate OIDC identities (no client secrets), each trusted only by one GitHub Environment:
#        azure-readonly  Reader + deployment preview       verify_azure_env
#        dev             Website Contributor on 'dev' slot  deploy_dev
#        prod            Website Contributor on the site    deploy_prod (required reviewers)
#      Release roles are granted by Bicep (infra-cicd.yml). Each environment stores its own
#      AZURE_CLIENT_ID variable; there must be no repository-level AZURE_CLIENT_ID.
#   2. Repository variables: AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP,
#      AZURE_BASE_NAME (defaults to 'cityops' if unset), ALLOW_SELF_APPROVAL (demo only).
#
# NO HARDCODING: webAppName/keyVaultName are never stored — resolved at deploy time by naming
# convention (main.bicep always names them 'app-<baseName>-*' / 'kv-<baseName>-*'), via the
# resolve-azure-names composite action.
name: CityOps App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC — full e2e run
    - cron: "0 4 * * 1" # weekly load test against dev
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate only, deploy dev, promote production, or load-test dev"
        type: choice
        options: [validate, dev, production, load-test]
        default: validate
      seed_demo_data:
        description: "Seed demo accounts/data in dev only (manual dev/production run)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.x"
  # Ephemeral database for integration/e2e. PostGIS image because CityOps uses PostGIS.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cityops_test

concurrency:
  # Hold the shared Azure lock through dev testing and production approval.
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'validate') || github.event.schedule == '0 4 * * 1') && 'cityops-azure-release' || format('cityops-app-{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect application changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.paths.outputs.app }}
      workshop: ${{ steps.paths.outputs.workshop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate bootstrap syntax and approval protection tests
        run: |
          bash -n scripts/setup-github.sh
          bash scripts/github/check-environment.test.sh
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCHEDULE: ${{ github.event.schedule }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "load-test" || "$SCHEDULE" == "0 4 * * 1" ]]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "workshop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "workshop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$BASE" "$HEAD" > changed-files.txt
          fi
          app=false
          workshop=false
          if grep -Eq '^(src/|prisma/|public/|e2e/|scripts/|[^/]+\.(ts|mjs|json)|\.github/)' changed-files.txt; then app=true; fi
          if grep -Eq '^(workshop/|scripts/|\.github/)' changed-files.txt; then workshop=true; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "workshop=$workshop" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # VERIFY AZURE ENV — fail fast, in its own job, if the target web app / key vault don't exist
  # yet (e.g. infra not deployed, or deployed under a different baseName/resource group). Runs
  # in parallel with build_and_unit_test (no needs:) so a missing environment surfaces within
  # seconds rather than after the full build+test pyramid. deploy_dev depends on it (and
  # deploy_prod depends on deploy_dev), so a missing environment is always its own clearly-named
  # job failure — never buried inside a deploy step's retry/backoff logic. Runs on the same
  # triggers as deploy_dev (mirrors ADO's Build.Reason in('IndividualCI','Manual')).
  # ---------------------------------------------------------------------------
  verify_azure_env:
    name: Verify Azure environment
    timeout-minutes: 10
    needs: [changes, ci_gate]
    if: ${{ !cancelled() && needs.ci_gate.result == 'success' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'dev' || inputs.operation == 'production'))) }}
    runs-on: ubuntu-latest
    environment: azure-readonly
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'cityops' }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify production approval configuration
        if: inputs.operation == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SELF_APPROVAL: ${{ vars.ALLOW_SELF_APPROVAL }}
        run: bash scripts/github/check-environment.sh prod
      - name: Azure login (OIDC, read-only identity)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify web app / key vault exist
        uses: ./.github/actions/verify-azure-resources
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          base-name: ${{ env.AZURE_BASE_NAME }}

  # ---------------------------------------------------------------------------
  # BUILD + UNIT — fast gate on every push/PR. Environment-agnostic build
  # (lazy Prisma), plus unit tests which need no external services.
  # ---------------------------------------------------------------------------
  build_and_unit_test:
    name: Build & Unit tests
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: npm run lint

      # Blocking: runtime (production) dependencies ship to Azure, so any high/critical fails CI.
      - name: Dependency vulnerability audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Warn-only: dev tooling (lint/test/CLI) never ships; upstream fixes can lag behind advisories.
      - name: Dependency vulnerability audit (dev tooling, warn-only)
        run: npm audit --audit-level=high || echo "::warning::Dev-only dependency advisories found (see log). They do not ship to Azure."

      - name: Code duplication check (warn-only, jscpd)
        run: npm run check:duplication || echo "::warning::Code duplication exceeds the 5% threshold (warn-only for now)."

      - name: Publish duplication report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 14

      - name: Unit tests
        run: mkdir -p reports && npm run test:unit -- --coverage --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: reports/unit.xml
          retention-days: 14

      - name: Publish code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

      - name: Upload unit coverage report for code-quality API
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-cobertura
          path: coverage/cobertura-coverage.xml
          retention-days: 14

      - name: Coverage gate (warn-only, target 60%)
        if: always()
        continue-on-error: true
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total.lines.pct; const min=60; console.log('Line coverage (unit scope): '+t+'% — target '+min+'%'); if(t<min){ console.log('::warning::Coverage '+t+'% is below the '+min+'% target'); }"

      - name: Build
        run: npm run build
        # Intentionally no env: — the build must not depend on runtime config or secrets.

      - name: Bundle size check (warn-only, size-limit)
        run: npm run check:bundle-size || echo "::warning::Client JS bundle exceeds the size-limit budget (warn-only for now)."

      - name: Assemble and validate standalone deploy package
        run: bash scripts/app/assemble-package.sh "$GITHUB_WORKSPACE/deploy-package"

      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: drop
          path: deploy-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # INTEGRATION — runs against an ephemeral PostGIS service. Gates push/PR.
  # ---------------------------------------------------------------------------
  integration_test:
    name: Integration tests
    timeout-minutes: 20
    needs: build_and_unit_test
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityops_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Integration tests
        run: mkdir -p reports && npm run test:integration -- --coverage --reporter=default --reporter=junit --outputFile.junit=reports/integration.xml

      - name: Publish integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: reports/integration.xml
          retention-days: 14

      - name: Publish code coverage (integration)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: coverage/
          retention-days: 14

      - name: Upload integration coverage report for code-quality API
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-cobertura
          path: coverage/cobertura-coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # UPLOAD COVERAGE — upload Cobertura reports to GitHub code-quality API.
  # Runs after the respective test jobs; skipped for fork PRs (no write token).
  # ---------------------------------------------------------------------------
  upload-coverage-typescript-unit:
    name: Upload unit coverage (TypeScript)
    timeout-minutes: 10
    needs: build_and_unit_test
    if: ${{ !cancelled() && needs.build_and_unit_test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download unit coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: unit-coverage-cobertura
      - name: Upload unit coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/unit

  upload-coverage-typescript-integration:
    name: Upload integration coverage (TypeScript)
    timeout-minutes: 10
    needs: integration_test
    if: ${{ !cancelled() && needs.integration_test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download integration coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: integration-coverage-cobertura
      - name: Upload integration coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/integration

  # ---------------------------------------------------------------------------
  # E2E — Playwright against the built app. Runs on PRs (pre-merge safety net),
  # the nightly schedule (health check), and manual runs (pre-prod promotion) —
  # NOT on every push to main, to keep the continuous dev-deploy path fast.
  # ---------------------------------------------------------------------------
  e2e_test:
    name: E2E tests
    timeout-minutes: 30
    needs: integration_test
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityops_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NEXTAUTH_URL: "http://localhost:3000"
      # Throwaway 32+ char value for ephemeral CI only — NOT a real secret.
      AUTH_SECRET: "ci-e2e-nonsecret-placeholder-0123456789"
      CI: "true"
      PLAYWRIGHT_STANDALONE: "true"
      HOSTNAME: "127.0.0.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Migrate & seed
        run: npm run db:migrate:deploy && npm run db:seed

      - name: Download the release package
        uses: actions/download-artifact@v8
        with:
          name: drop
          path: drop

      - name: Playwright e2e
        run: npm run test:e2e
        # Playwright starts the same standalone package that will be deployed.

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # UI TESTS — accessibility (axe-core), visual regression (screenshot diffing), and
  # cross-browser/responsive (firefox/webkit/mobile viewport) checks. Runs in parallel with
  # e2e_test (same needs/if) — separated from it because these have different failure
  # semantics: a visual diff often means "UI changed on purpose, approve a new baseline" rather
  # than "the app is broken", so it shouldn't share a job with the hard functional gate.
  # Visual baselines are OS/font-rendering-sensitive — generated once in CI (see
  # docs/deployment-guidelines.md §11.8), not on a local dev machine.
  # ---------------------------------------------------------------------------
  ui_test:
    name: UI tests (a11y, visual, cross-browser)
    timeout-minutes: 45
    needs: integration_test
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityops_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NEXTAUTH_URL: "http://localhost:3000"
      # Throwaway 32+ char value for ephemeral CI only — NOT a real secret.
      AUTH_SECRET: "ci-e2e-nonsecret-placeholder-0123456789"
      CI: "true"
      PLAYWRIGHT_STANDALONE: "true"
      HOSTNAME: "127.0.0.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Migrate & seed
        run: npm run db:migrate:deploy && npm run db:seed

      - name: Download the release package
        uses: actions/download-artifact@v8
        with:
          name: drop
          path: drop

      - name: Playwright UI tests (a11y + visual + cross-browser)
        run: npm run test:ui
        # Playwright starts the same standalone package that will be deployed.

      - name: Publish UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # DEPLOY (Dev slot) — deploy the built app to the 'dev' slot and migrate the
  # dev database (cityops_dev). Gated by the 'dev' environment (no approval — fast
  # continuous feedback). Runs on direct pushes to main and manual runs, but NOT
  # on pull_request/schedule (mirrors ADO's Build.Reason in('IndividualCI','Manual')).
  # ---------------------------------------------------------------------------
  deploy_dev:
    name: Deploy to Dev slot
    timeout-minutes: 30
    needs: [build_and_unit_test, ci_gate, verify_azure_env]
    # ci_gate depends on jobs skipped on push (e2e/ui), so explicit result checks are needed;
    # without !cancelled() the skipped status would propagate and silently skip deployment.
    if: ${{ !cancelled() && needs.build_and_unit_test.result == 'success' && needs.ci_gate.result == 'success' && needs.verify_azure_env.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'dev' || inputs.operation == 'production'))) }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'cityops' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-display-name: "Install deps (Prisma CLI)"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve web app / key vault names
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          base-name: ${{ env.AZURE_BASE_NAME }}

      # The private Key Vault is unreachable from GitHub-hosted runners; the dev environment
      # holds its own DATABASE_URL secret (scripts/setup-github.sh).
      - name: Load dev DB connection
        env:
          ENV_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$ENV_DATABASE_URL" ] || { echo "::error::DATABASE_URL secret is missing in the 'dev' environment. Re-run scripts/setup-github.sh with PG_ADMIN_PASSWORD."; exit 1; }
          echo "DATABASE_URL=$ENV_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Migrate cityops_dev
        run: npm run db:migrate:deploy

      - name: Seed dev demo data (explicit opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_demo_data
        run: npm run db:seed

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: drop
          path: drop

      - name: Deploy to dev slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.names.outputs.web-app-name }}
          slot-name: dev
          package: drop
          startup-command: "node server.js"

      - name: Smoke test dev slot (/api/health)
        uses: ./.github/actions/smoke-test
        with:
          url: "https://${{ steps.names.outputs.web-app-name }}-dev.azurewebsites.net/api/health"

  # ---------------------------------------------------------------------------
  # ZAP SCAN — OWASP ZAP baseline (passive) DAST scan against the just-deployed dev slot.
  # App-pipeline only: unlike the infra pipeline (which never deploys app code), this is the
  # only place a real, scannable app exists (see docs/deployment-guidelines.md §11.7.3).
  # Warning-level findings remain advisory (-I); FAIL alerts and scanner errors block promotion.
  # ---------------------------------------------------------------------------
  zap_scan:
    name: OWASP ZAP baseline scan (dev slot)
    timeout-minutes: 15
    needs: deploy_dev
    if: ${{ !cancelled() && needs.deploy_dev.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'cityops' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve web app name
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          base-name: ${{ env.AZURE_BASE_NAME }}

      # Warm the slot first: the first render after a deploy can exceed ZAP's spider read timeout.
      - name: Warm up dev slot
        run: |
          base="https://${{ steps.names.outputs.web-app-name }}-dev.azurewebsites.net"
          for path in / /map /reports /sign-in; do
            curl --silent --output /dev/null --max-time 120 --write-out "$path -> %{http_code} in %{time_total}s\n" "$base$path" || true
          done

      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p zap
          chmod a+w zap
          docker run --rm -v "$(pwd)/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "https://${{ steps.names.outputs.web-app-name }}-dev.azurewebsites.net" \
            -m 5 -r zap-baseline-report.html -J zap-baseline-report.json -I \
            -z "-config connection.timeoutInSecs=120"

      - name: Upload ZAP baseline report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: zap/

  # ---------------------------------------------------------------------------
  # DEPLOY (Production) — migrate the prod DB (cityops), then SWAP dev → production
  # for a zero-downtime release (rollback = swap back). Gated by the 'prod' environment's
  # required reviewers AND only runs on a manual run (workflow_dispatch) — the only
  # trigger where e2e_test also runs in the SAME run, so production can never deploy
  # without E2E passing, without E2E running on every ordinary push.
  # To promote to prod: Actions → CityOps App CI/CD → Run workflow (on main).
  # ---------------------------------------------------------------------------
  deploy_prod:
    name: Deploy to Production (swap)
    timeout-minutes: 30
    needs: [deploy_dev, ci_gate, zap_scan]
    if: ${{ !cancelled() && needs.deploy_dev.result == 'success' && needs.ci_gate.result == 'success' && needs.zap_scan.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'production' }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: cityops-prod-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'cityops' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-display-name: "Install deps (Prisma CLI)"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve web app / key vault names
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          base-name: ${{ env.AZURE_BASE_NAME }}

      - name: Load prod DB connection
        env:
          ENV_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$ENV_DATABASE_URL" ] || { echo "::error::DATABASE_URL secret is missing in the 'prod' environment. Re-run scripts/setup-github.sh with PG_ADMIN_PASSWORD."; exit 1; }
          echo "DATABASE_URL=$ENV_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Migrate cityops (prod)
        run: npm run db:migrate:deploy

      - name: Swap dev → production
        run: az webapp deployment slot swap -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.names.outputs.web-app-name }}" --slot dev --target-slot production

      - name: Smoke test production (/api/health)
        uses: ./.github/actions/smoke-test
        with:
          url: "https://${{ steps.names.outputs.web-app-name }}.azurewebsites.net/api/health"

  codeql:
    name: Security analysis (${{ matrix.language }})
    if: inputs.operation != 'load-test' && github.event.schedule != '0 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  devskim:
    name: DevSkim analysis
    if: inputs.operation != 'load-test' && github.event.schedule != '0 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/DevSkim-Action@v1
        with:
          ignore-globs: "**/.git/**,**/node_modules/**,**/.next/**,coverage/**,reports/**,src/generated/**,public/uploads/**,workshop/public/assets/images/**"
          output-filename: devskim-results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: devskim-results.sarif
          category: devskim
          wait-for-processing: true

  workshop_build:
    name: Workshop checks and build
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.workshop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: workshop/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
        working-directory: workshop
      - run: npm run lint && npm run check && npm run build && npm run verify
        working-directory: workshop
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workshop/out

  ci_gate:
    name: CI gate
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - build_and_unit_test
      - integration_test
      - e2e_test
      - ui_test
      - upload-coverage-typescript-unit
      - upload-coverage-typescript-integration
      - codeql
      - dependency-review
      - devskim
      - workshop_build
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require all selected checks to pass
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
          echo "$RESULTS" | jq -e '.changes.result == "success"'
          echo "$RESULTS" | jq -e '
            if .changes.outputs.app == "true" then
              .build_and_unit_test.result == "success" and .integration_test.result == "success"
            else true end |
            select(. == true)'

  workshop_deploy:
    name: Deploy workshop to Pages
    timeout-minutes: 10
    needs: [workshop_build, ci_gate]
    if: ${{ !cancelled() && needs.workshop_build.result == 'success' && needs.ci_gate.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'dev' || inputs.operation == 'production'))) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  load_test:
    name: k6 load test (dev slot)
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'load-test') || github.event.schedule == '0 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/resolve-azure-names
        id: names
        with:
          base-name: ${{ vars.AZURE_BASE_NAME || 'cityops' }}
      - name: Run k6 with blocking thresholds
        env:
          BASE_URL: https://${{ steps.names.outputs.web-app-name }}-dev.azurewebsites.net
        run: |
          mkdir -p k6-out
          chmod a+w k6-out
          docker run --rm \
            -v "$PWD/performance-tests:/scripts:ro" \
            -v "$PWD/k6-out:/out:rw" \
            -e BASE_URL \
            grafana/k6:1.0.0 run --summary-export=/out/k6-summary.json /scripts/load-test.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-load-test-report
          path: k6-out/
