# CityOps dependency review — blocks PRs that introduce vulnerable or newly-added
# risky dependencies, before they ever reach main.
#
# This is a GATE ON CHANGE, complementary to the two controls already in place:
#   - Dependabot (.github/dependabot.yml) — finds vulnerabilities in what is ALREADY merged
#     and opens PRs to fix them. Reactive, and only as fast as its schedule.
#   - `npm audit --audit-level=high` in app-cicd.yml — warn-only by design, so it reports
#     but never blocks.
# Neither stops a PR from ADDING a vulnerable package. This workflow does.
#
# PREREQUISITES (already satisfied on this repo — verified via the REST API):
#   - Dependency graph enabled (GET /repos/{o}/{r}/vulnerability-alerts → 204).
#   - GitHub Advanced Security / code security enabled, which is what makes the dependency
#     review API available on a PRIVATE repo. Without it the action fails with a 403.
name: Dependency Review

# pull_request ONLY. The action diffs the dependency graph between two refs, and on a PR it
# infers those automatically. It can be pointed at arbitrary refs via its base-ref/head-ref
# inputs, but on a bare push event with no such inputs it fails with "Can't find base or
# head". Scanning already-merged code is Dependabot's job, so a push trigger would add cost
# without adding coverage.
on:
  pull_request:
    branches: [main]

# Deliberately NO paths filter. Both npm trees (root app + workshop) are covered
# automatically because the action reads the PR's dependency-graph diff rather than a fixed
# manifest path, and a lockfile can change without its package.json doing so. If this check
# is ever made required by the main ruleset, a paths filter would also make it report no
# status at all on unrelated PRs and block them — the same trap documented in codeql.yml.
permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the dependency graph for base and head
      pull-requests: write # post the summary comment
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # Matches the `code_scanning` rule on the main ruleset, which gates merges at
          # high_or_higher. Keeping the two thresholds aligned avoids the confusing state
          # where one security gate blocks a PR and the other waves it through.
          fail-on-severity: high
          # Only comment when it actually fails; a passing check needs no PR noise.
          comment-summary-in-pr: on-failure
