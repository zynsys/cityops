# Workflow for deploying the CityOps workshop site to GitHub Pages
#
name: Deploy Workshop Site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "workshop/**"
      - ".github/workflows/workshop-pages-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workshop/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: workshop
      - name: Lint
        run: npm run lint
        working-directory: workshop
      - name: Validate workshop content
        run: npm run check
        working-directory: workshop
      - name: Generate workshop site
        run: npm run build
        working-directory: workshop
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify generated artifact
        run: npm run verify
        working-directory: workshop
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./workshop/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
