# CityOps — Infrastructure pipeline (Bicep). GitHub Actions equivalent of .ado/infra-cicd.yml.
# IaC has no compiled artifact, so the "build/CI" is lint + what-if (a safe preview), governance
# is a dedicated compliance stage, and the "release/CD" is the apply. Job order:
#   validate  →  {policy_compliance, cost_estimate}  →  deploy (environment approval)  →  smoke_test
#
# NO HARDCODING: environment-specific values come from repo variables/secrets below. Resource
# NAMES (web app, key vault, slot) are never hardcoded — they're derived deterministically inside
# main.bicep and resolved dynamically by naming convention at deploy time in app-cicd.yml.
#
# PREREQUISITES (one-time — see docs/deployment-guidelines.md):
#   1. An Entra ID app registration with a federated credential trusting this repo (OIDC — no
#      client secret). Its service principal needs Contributor + User Access Administrator (or
#      Owner) at the target scope — User Access Administrator is required because the template
#      creates Key Vault role assignments. Store as repo secrets:
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   2. Repo variables (Settings → Secrets and variables → Actions → Variables):
#        AZURE_RESOURCE_GROUP, AZURE_LOCATION, AZURE_DB_LOCATION, AZURE_BASE_NAME (default
#        'cityops'), AZURE_OPENAI_ACCOUNT_NAME, ALERT_EMAIL_ADDRESS (email that receives Azure
#        Monitor alerts when the deployed app raises exceptions/failed requests; leave unset/blank
#        to fall back to the triggering commit's author email)
#   3. Repo/environment secrets (Settings → Secrets and variables → Actions → Secrets):
#        PG_ADMIN_PASSWORD  (fixed — changing it rotates the DB admin password)
#        AUTH_SECRET        (fixed, >= 32 chars — changing it invalidates prod sessions)
#        AUTH_SECRET_DEV    (fixed, >= 32 chars — changing it invalidates dev sessions)
#   4. GitHub Environment 'prod' with required reviewers — the deploy job targets it because a
#      single Bicep apply provisions/updates shared, production-impacting resources (Key Vault,
#      PostgreSQL, App Service plan) that both the dev slot and production sit on.
#
# Run this workflow FIRST (before app-cicd.yml ever needs to deploy anything) — it provisions the
# resource group, App Service (+ dev slot), PostgreSQL, Key Vault, and Azure OpenAI, and wires up
# the RBAC between them, so the app workflow always finds a ready-to-deploy-to environment.
name: CityOps Infra CI/CD

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-cicd.yml"
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC — drift detection (what-if only; deploy stays manual-gated)
  workflow_dispatch: {} # manual run — required to apply

env:
  AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'cityops' }}

jobs:
  # -------------------------------------------------------------------------
  # VALIDATE = the "build/CI" for infrastructure: lint + what-if preview.
  # Read-only. Runs on PRs and main so infra changes are reviewed before apply.
  # -------------------------------------------------------------------------
  validate:
    name: Validate (lint + what-if)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bicep unit tests (Pester)
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.6.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'infra/tests/Bicep.Unit.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'bicep-unit-tests.xml'
          Invoke-Pester -Configuration $config
      - name: Upload Bicep unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bicep-unit-tests
          path: bicep-unit-tests.xml
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint + what-if preview
        run: |
          set -e
          # Falls back to the triggering commit's author email when ALERT_EMAIL_ADDRESS is
          # unset — a real, accountable inbox by default.
          ALERT_EMAIL="${{ vars.ALERT_EMAIL_ADDRESS }}"
          if [[ -z "$ALERT_EMAIL" ]]; then
            ALERT_EMAIL="$(git log -1 --pretty=format:'%ae')"
          fi
          az bicep build --file infra/main.bicep
          az deployment sub what-if \
            --location "${{ vars.AZURE_LOCATION }}" \
            -f infra/main.bicep \
            -p resourceGroupName="${{ vars.AZURE_RESOURCE_GROUP }}" \
               location="${{ vars.AZURE_LOCATION }}" \
               dbLocation="${{ vars.AZURE_DB_LOCATION }}" \
               baseName="${{ env.AZURE_BASE_NAME }}" \
               openAiAccountName="${{ vars.AZURE_OPENAI_ACCOUNT_NAME }}" \
               alertEmailAddress="$ALERT_EMAIL" \
               pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
               authSecret="${{ secrets.AUTH_SECRET }}" \
               authSecretDev="${{ secrets.AUTH_SECRET_DEV }}"

  # -------------------------------------------------------------------------
  # POLICY COMPLIANCE = governance drift check. Reads the resource group's Azure
  # Policy compliance state and fails the job if anything is non-compliant, so
  # infra is never (re-)applied on top of a drifted environment (e.g. a tag
  # removed manually, outside Bicep). Runs on every trigger that runs validate
  # (push/PR/nightly), giving continuous visibility even between applies; only
  # the deploy job is actually blocked by it.
  # -------------------------------------------------------------------------
  policy_compliance:
    name: Policy compliance (drift check)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/checkout@v4
      - name: Azure Policy compliance check
        uses: ./.github/actions/azure-policy-compliance
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          fail-on-noncompliant: "true"
          trigger-scan: "true" # infra runs are infrequent/manual — the extra minutes for a fresh evaluation are cheap here

  # -------------------------------------------------------------------------
  # COST ESTIMATE = informational, non-blocking. Queries the public Azure Retail
  # Prices API for the fixed-capacity resources this template provisions (App
  # Service plan, PostgreSQL compute + storage) and prints a monthly estimate, so
  # cost impact is visible before anyone manually triggers deploy. Usage-based
  # resources (Azure OpenAI, App Insights/Log Analytics, Key Vault operations)
  # have no fixed monthly rate and are called out separately rather than guessed.
  # SKU/storage constants below must be kept in sync with appservice.bicep /
  # postgres.bicep if those defaults ever change.
  # -------------------------------------------------------------------------
  cost_estimate:
    name: Cost estimate
    needs: validate
    runs-on: ubuntu-latest
    env:
      APP_SERVICE_SKU: S1 # must match appServiceSkuName default in main.bicep
      PG_COMPUTE_SKU: B1MS # must match the sku.name in postgres.bicep
      PG_STORAGE_GB: 32 # must match storageSizeGB in postgres.bicep
    steps:
      - name: Estimate monthly infra cost (Azure Retail Prices API)
        run: |
          set -e
          fetch_price() {
            curl -s -G "https://prices.azure.com/api/retail/prices" \
              --data-urlencode "api-version=2023-01-01-preview" \
              --data-urlencode "\$filter=$1"
          }

          APP_JSON=$(fetch_price "armRegionName eq '${{ vars.AZURE_LOCATION }}' and serviceName eq 'Azure App Service' and skuName eq '$APP_SERVICE_SKU' and type eq 'Consumption' and contains(productName, 'Linux')")
          PG_COMPUTE_JSON=$(fetch_price "armRegionName eq '${{ vars.AZURE_DB_LOCATION }}' and serviceName eq 'Azure Database for PostgreSQL' and contains(productName, 'Burstable BS Series Compute') and meterName eq '$PG_COMPUTE_SKU'")
          PG_STORAGE_JSON=$(fetch_price "armRegionName eq '${{ vars.AZURE_DB_LOCATION }}' and productName eq 'Azure Database for PostgreSQL Flex Server Storage' and meterName eq 'Storage Data Stored'")

          python3 - "$APP_JSON" "$PG_COMPUTE_JSON" "$PG_STORAGE_JSON" 730 "$PG_STORAGE_GB" "$APP_SERVICE_SKU" "$PG_COMPUTE_SKU" "${{ vars.AZURE_LOCATION }}" "${{ vars.AZURE_DB_LOCATION }}" <<'PYEOF'
          import json, sys

          app, pg_compute, pg_storage = (json.loads(a) for a in sys.argv[1:4])
          hours, storage_gb = float(sys.argv[4]), float(sys.argv[5])
          app_sku, pg_sku, loc, db_loc = sys.argv[6:10]

          def price(d):
              items = d.get("Items") or []
              return items[0]["unitPrice"] if items else 0.0

          app_hourly, pg_compute_hourly, pg_storage_per_gb = price(app), price(pg_compute), price(pg_storage)
          app_monthly = round(app_hourly * hours, 2)
          pg_compute_monthly = round(pg_compute_hourly * hours, 2)
          pg_storage_monthly = round(pg_storage_per_gb * storage_gb, 2)
          total = round(app_monthly + pg_compute_monthly + pg_storage_monthly, 2)

          print("=" * 68)
          print(" CityOps infra — estimated MONTHLY cost (fixed-capacity resources)")
          print("=" * 68)
          print(f"  App Service Plan ({app_sku} Linux, {loc}):       ${app_monthly}/mo")
          print(f"  PostgreSQL compute ({pg_sku}, {db_loc}):         ${pg_compute_monthly}/mo")
          print(f"  PostgreSQL storage ({int(storage_gb)} GB):               ${pg_storage_monthly}/mo")
          print("-" * 68)
          print(f"  Estimated fixed-capacity subtotal:            ${total}/mo")
          print()
          print("  NOT included (usage-based, no fixed monthly rate):")
          print("    - Azure OpenAI (GlobalStandard is billed per-token)")
          print("    - Application Insights / Log Analytics (billed per-GB ingested)")
          print("    - Key Vault (billed per operation)")
          print()
          print("  Source: Azure Retail Prices API (public USD list price, PAYG —")
          print("  actual billed cost may differ with reservations/discounts).")
          print("=" * 68)

          if 0.0 in (app_hourly, pg_compute_hourly, pg_storage_per_gb):
              print("::warning::One or more prices could not be resolved from the Retail Prices API — the estimate above is incomplete.")
          PYEOF

  # -------------------------------------------------------------------------
  # DEPLOY = the "release/CD": apply the template. Runs on push to main and on
  # manual runs (workflow_dispatch) — but NOT on PRs. This infra apply is a
  # single, atomic operation against SHARED resources (one Key Vault, one Postgres
  # server, one App Service plan) serving both dev and prod at once, so there is
  # no separate "dev infra" to validate in isolation first. The validate job's
  # `what-if` output (runs on every push/PR) is the pre-apply review; the 'prod'
  # environment's required reviewers are the deliberate human gate before apply.
  # policy_compliance is an additional automated gate: if the resource group has
  # drifted out of policy compliance since the last apply, deploy never runs.
  # To apply: push/merge to main (auto) or Actions → CityOps Infra CI/CD → Run workflow.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy (apply)
    needs: [policy_compliance, cost_estimate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: cityops-infra-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment sub create
        run: |
          set -e
          # Falls back to the triggering commit's author email when ALERT_EMAIL_ADDRESS is
          # unset — a real, accountable inbox by default.
          ALERT_EMAIL="${{ vars.ALERT_EMAIL_ADDRESS }}"
          if [[ -z "$ALERT_EMAIL" ]]; then
            ALERT_EMAIL="$(git log -1 --pretty=format:'%ae')"
          fi
          az deployment sub create \
            --location "${{ vars.AZURE_LOCATION }}" \
            -n cityops-infra \
            -f infra/main.bicep \
            -p resourceGroupName="${{ vars.AZURE_RESOURCE_GROUP }}" \
               location="${{ vars.AZURE_LOCATION }}" \
               dbLocation="${{ vars.AZURE_DB_LOCATION }}" \
               baseName="${{ env.AZURE_BASE_NAME }}" \
               openAiAccountName="${{ vars.AZURE_OPENAI_ACCOUNT_NAME }}" \
               alertEmailAddress="$ALERT_EMAIL" \
               pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
               authSecret="${{ secrets.AUTH_SECRET }}" \
               authSecretDev="${{ secrets.AUTH_SECRET_DEV }}" \
            --query "properties.outputs" -o json | tee infra-outputs.json

      - name: Publish deployment outputs (webAppName, keyVaultName, etc.)
        uses: actions/upload-artifact@v4
        with:
          name: infra-outputs
          path: infra-outputs.json

  # -------------------------------------------------------------------------
  # SMOKE TEST = post-deploy verification. Confirms the resources this apply just
  # (re-)provisioned are actually healthy, not just that ARM reported success.
  # Key Vault / PostgreSQL / Azure OpenAI provisioning state is a hard gate
  # (these are always expected healthy right after a successful apply). Web app
  # HTTP reachability is informational only: on the very first-ever infra deploy
  # there is no app code yet (app-cicd.yml deploys that separately), so a non-200
  # response there is normal until the app workflow has run at least once.
  # -------------------------------------------------------------------------
  smoke_test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: infra-outputs

      - name: Verify provisioned resources are healthy (Pester)
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.6.1
          $container = New-PesterContainer -Path 'infra/tests/Infra.Integration.Tests.ps1' -Data @{
            OutputsPath       = 'infra-outputs.json'
            ResourceGroup     = '${{ vars.AZURE_RESOURCE_GROUP }}'
            OpenAiAccountName = '${{ vars.AZURE_OPENAI_ACCOUNT_NAME }}'
          }
          $config = New-PesterConfiguration
          $config.Run.Container = $container
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'infra-integration-tests.xml'
          Invoke-Pester -Configuration $config

      - name: Upload infra integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-integration-tests
          path: infra-integration-tests.xml
