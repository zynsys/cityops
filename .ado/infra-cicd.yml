# CityOps — Infrastructure pipeline (Bicep)
# IaC has no compiled artifact, so the "build/CI" is lint + what-if (a safe preview), governance
# is a dedicated compliance stage, and the "release/CD" is the apply. All three live in ONE
# multi-stage YAML (not separate pipelines):
#   Validate (build)  →  PolicyCompliance (governance)  →  Deploy (release, gated by an environment approval)
#
# NO HARDCODING: environment-specific values (resource group, regions, secrets) come from Library
# variable groups below. The service connection name IS a literal ('cityops-azure-service-connection') rather than
# a variable-group macro — ADO's static resource-authorization check for 'azureSubscription:'
# inputs can't resolve a runtime '$(...)' macro (it checks the literal unexpanded string), so it
# must be compile-time-known. If you rename it, update here too (see docs/deployment-guidelines.md §5.3).
#
# PREREQUISITES (one-time — see docs/deployment-guidelines.md §3):
#   1. ARM service connection named 'cityops-azure-service-connection' (see above). Its service principal needs
#      Contributor + User Access Administrator (or Owner) at the target scope — User Access
#      Administrator is required because the template creates Key Vault role assignments.
#   2. Variable group 'cityops-env' (Library, plain vars) — shared by this pipeline AND
#      .ado/app-cicd.yml: resourceGroup, location, dbLocation, alertEmailAddress (email that
#      receives Azure Monitor alerts when the deployed app raises exceptions/failed requests;
#      leave blank to fall back to Build.RequestedForEmail — the person who triggered the run).
#   3. Variable group 'cityops-infra' (Library, SECRET, stable vars) — this pipeline only:
#        - pgAdminPassword  (fixed — changing it rotates the DB admin password)
#        - authSecret       (fixed, >= 32 chars — changing it invalidates prod sessions)
#        - authSecretDev    (fixed, >= 32 chars — changing it invalidates dev sessions)
#   4. Pipelines → Environments: 'dev' (no approval) and 'prod' (approval check). The Deploy
#      stage below targets 'prod' because a single Bicep apply provisions/updates the shared,
#      production-impacting resources (Key Vault, PostgreSQL, App Service plan) that both the
#      dev slot and production sit on.
#
# Resource NAMES (web app, key vault, slot) are never hardcoded — they're derived
# deterministically inside main.bicep and resolved dynamically by naming convention at
# deploy time in app-cicd.yml, so this pipeline never needs to know them either.
#
# main.bicep is subscription-scoped: it creates the resource group itself (via
# modules/resourcegroup.bicep) before deploying everything else into it, so there's no manual
# 'az group create' step before this pipeline can run — hence 'az deployment sub ...' below,
# not 'az deployment group ...', and '--location' instead of '-g'.
#
# Run this pipeline FIRST (before app-cicd.yml ever needs to deploy anything) — it provisions the
# resource group, App Service (+ dev slot), PostgreSQL, Key Vault, and Azure OpenAI, and wires up
# the RBAC between them, so the app pipeline always finds a ready-to-deploy-to environment.

trigger:
  branches:
    include: [main]
  paths:
    include:
      - infra/**
      - .ado/infra-cicd.yml

pr:
  branches:
    include: [main]
  paths:
    include:
      - infra/**
      - .ado/infra-cicd.yml

schedules:
  - cron: '0 3 * * *' # nightly 03:00 UTC — drift detection (what-if only; Deploy never runs on schedule)
    displayName: Nightly drift detection
    branches:
      include:
        - main
    always: true

variables:
  - group: cityops-env # resourceGroup, location, dbLocation, baseName, openAiAccountName, alertEmailAddress
  - group: cityops-infra # secret vars: pgAdminPassword, authSecret, authSecretDev

stages:
  # -------------------------------------------------------------------------
  # VALIDATE = the "build/CI" for infrastructure: lint + what-if preview.
  # Read-only. Runs on PRs and main so infra changes are reviewed before apply.
  # -------------------------------------------------------------------------
  - stage: Validate
    displayName: 'Validate (lint + what-if)'
    jobs:
      - job: validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: PowerShell@2
            displayName: 'Bicep unit tests (Pester)'
            inputs:
              pwsh: true
              targetType: inline
              script: |
                Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
                Import-Module Pester -RequiredVersion 5.6.1
                $config = New-PesterConfiguration
                $config.Run.Path = 'infra/tests/Bicep.Unit.Tests.ps1'
                $config.Run.Exit = $true
                $config.Output.Verbosity = 'Detailed'
                $config.TestResult.Enabled = $true
                $config.TestResult.OutputFormat = 'NUnitXml'
                $config.TestResult.OutputPath = '$(Build.ArtifactStagingDirectory)/bicep-unit-tests.xml'
                Invoke-Pester -Configuration $config
          - task: PublishTestResults@2
            displayName: 'Publish Bicep unit test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'NUnit'
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/bicep-unit-tests.xml'
              testRunTitle: 'Bicep unit tests'
          - task: AzureCLI@2
            displayName: 'Bicep lint + what-if preview'
            inputs:
              azureSubscription: 'cityops-azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                # Falls back to the person who triggered this run when cityops-env's
                # alertEmailAddress is blank — a real, accountable inbox by default.
                ALERT_EMAIL="$(alertEmailAddress)"
                if [[ -z "$ALERT_EMAIL" ]]; then
                  ALERT_EMAIL="$(Build.RequestedForEmail)"
                fi
                az bicep build --file infra/main.bicep
                az deployment sub what-if \
                  --location "$(location)" \
                  -f infra/main.bicep \
                  -p resourceGroupName="$(resourceGroup)" \
                     location="$(location)" \
                     dbLocation="$(dbLocation)" \
                     baseName="$(baseName)" \
                     openAiAccountName="$(openAiAccountName)" \
                     alertEmailAddress="$ALERT_EMAIL" \
                     pgAdminPassword="$(pgAdminPassword)" \
                     authSecret="$(authSecret)" \
                     authSecretDev="$(authSecretDev)"

  # -------------------------------------------------------------------------
  # POLICY COMPLIANCE = governance drift check. Reads the resource group's Azure
  # Policy compliance state and fails the stage if anything is non-compliant, so
  # infra is never (re-)applied on top of a drifted environment (e.g. a tag
  # removed manually, outside Bicep). Runs on every trigger that runs Validate
  # (push/PR/nightly), giving continuous visibility even between applies; only
  # the Deploy stage (manual-gated) is actually blocked by it. Uses `az policy
  # state` because the built-in AzurePolicyCheckGate task is Classic-release-only
  # and cannot run in a YAML pipeline.
  # -------------------------------------------------------------------------
  - stage: PolicyCompliance
    displayName: 'Policy compliance (drift check)'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: policy_check
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - template: templates/azure-policy-compliance.yml
            parameters:
              azureServiceConnection: 'cityops-azure-service-connection'
              resourceGroup: '$(resourceGroup)'
              failOnNonCompliant: true
              triggerScan: true # infra runs are infrequent/manual — the extra minutes for a fresh evaluation are cheap here

  # -------------------------------------------------------------------------
  # COST ESTIMATE = informational, non-blocking. Queries the public Azure Retail
  # Prices API for the fixed-capacity resources this template provisions (App
  # Service plan, PostgreSQL compute + storage) and prints a monthly estimate, so
  # cost impact is visible before anyone manually triggers Deploy. Usage-based
  # resources (Azure OpenAI, App Insights/Log Analytics, Key Vault operations)
  # have no fixed monthly rate and are called out separately rather than guessed.
  # SKU/storage constants below must be kept in sync with appservice.bicep /
  # postgres.bicep if those defaults ever change.
  # -------------------------------------------------------------------------
  - stage: CostEstimate
    displayName: 'Cost estimate'
    dependsOn: Validate
    condition: succeeded()
    variables:
      - name: appServiceSku
        value: S1 # must match appServiceSkuName default in main.bicep
      - name: pgComputeSku
        value: B1MS # must match the sku.name in postgres.bicep
      - name: pgStorageGb
        value: 32 # must match storageSizeGB in postgres.bicep
    jobs:
      - job: cost_estimate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - script: |
              set -e
              fetch_price() {
                curl -s -G "https://prices.azure.com/api/retail/prices" \
                  --data-urlencode "api-version=2023-01-01-preview" \
                  --data-urlencode "\$filter=$1"
              }

              APP_JSON=$(fetch_price "armRegionName eq '$(location)' and serviceName eq 'Azure App Service' and skuName eq '$(appServiceSku)' and type eq 'Consumption' and contains(productName, 'Linux')")
              PG_COMPUTE_JSON=$(fetch_price "armRegionName eq '$(dbLocation)' and serviceName eq 'Azure Database for PostgreSQL' and contains(productName, 'Burstable BS Series Compute') and meterName eq '$(pgComputeSku)'")
              PG_STORAGE_JSON=$(fetch_price "armRegionName eq '$(dbLocation)' and productName eq 'Azure Database for PostgreSQL Flex Server Storage' and meterName eq 'Storage Data Stored'")

              python3 - "$APP_JSON" "$PG_COMPUTE_JSON" "$PG_STORAGE_JSON" 730 "$(pgStorageGb)" "$(appServiceSku)" "$(pgComputeSku)" "$(location)" "$(dbLocation)" <<'PYEOF'
              import json, sys

              app, pg_compute, pg_storage = (json.loads(a) for a in sys.argv[1:4])
              hours, storage_gb = float(sys.argv[4]), float(sys.argv[5])
              app_sku, pg_sku, loc, db_loc = sys.argv[6:10]

              def price(d):
                  items = d.get("Items") or []
                  return items[0]["unitPrice"] if items else 0.0

              app_hourly, pg_compute_hourly, pg_storage_per_gb = price(app), price(pg_compute), price(pg_storage)
              app_monthly = round(app_hourly * hours, 2)
              pg_compute_monthly = round(pg_compute_hourly * hours, 2)
              pg_storage_monthly = round(pg_storage_per_gb * storage_gb, 2)
              total = round(app_monthly + pg_compute_monthly + pg_storage_monthly, 2)

              print("=" * 68)
              print(" CityOps infra — estimated MONTHLY cost (fixed-capacity resources)")
              print("=" * 68)
              print(f"  App Service Plan ({app_sku} Linux, {loc}):       ${app_monthly}/mo")
              print(f"  PostgreSQL compute ({pg_sku}, {db_loc}):         ${pg_compute_monthly}/mo")
              print(f"  PostgreSQL storage ({int(storage_gb)} GB):               ${pg_storage_monthly}/mo")
              print("-" * 68)
              print(f"  Estimated fixed-capacity subtotal:            ${total}/mo")
              print()
              print("  NOT included (usage-based, no fixed monthly rate):")
              print("    - Azure OpenAI (GlobalStandard is billed per-token)")
              print("    - Application Insights / Log Analytics (billed per-GB ingested)")
              print("    - Key Vault (billed per operation)")
              print()
              print("  Source: Azure Retail Prices API (public USD list price, PAYG —")
              print("  actual billed cost may differ with reservations/discounts).")
              print("=" * 68)

              if 0.0 in (app_hourly, pg_compute_hourly, pg_storage_per_gb):
                  print("##vso[task.logissue type=warning]One or more prices could not be resolved from the Retail Prices API — the estimate above is incomplete.")
              PYEOF
            displayName: 'Estimate monthly infra cost (Azure Retail Prices API)'

  # -------------------------------------------------------------------------
  # DEPLOY = the "release/CD": apply the template. Runs on push to main (IndividualCI)
  # and on manual runs — but NOT on PRs or the nightly schedule. This
  # infra apply is a single, atomic operation against SHARED resources (one Key Vault,
  # one Postgres server, one App Service plan) serving both dev and prod at once, so
  # there is no separate "dev infra" to validate in isolation first, the way the app
  # tests in the dev slot before promoting. The Validate stage's `what-if` output —
  # which runs automatically on every push/PR — is the pre-apply review; the 'prod'
  # environment approval below is the deliberate human gate before the apply proceeds.
  # The PolicyCompliance stage is an additional automated gate: if the resource group
  # has drifted out of policy compliance since the last apply, Deploy never runs. Still
  # gated by the SAME 'prod' environment/approval used by the app's Deploy_Prod stage.
  # To apply: push/merge to main (auto) or Pipelines → infra → Run pipeline on main.
  # -------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy (apply)'
    dependsOn:
      - PolicyCompliance
      - CostEstimate
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    lockBehavior: sequential # exclusive-lock check on the 'prod' Environment (§11.2) serializes applies
    jobs:
      - deployment: deploy
        environment: prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'az deployment group create'
                  inputs:
                    azureSubscription: 'cityops-azure-service-connection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # Falls back to the person who triggered this run when cityops-env's
                      # alertEmailAddress is blank — a real, accountable inbox by default.
                      ALERT_EMAIL="$(alertEmailAddress)"
                      if [[ -z "$ALERT_EMAIL" ]]; then
                        ALERT_EMAIL="$(Build.RequestedForEmail)"
                      fi
                      az deployment sub create \
                        --location "$(location)" \
                        -n cityops-infra \
                        -f infra/main.bicep \
                        -p resourceGroupName="$(resourceGroup)" \
                           location="$(location)" \
                           dbLocation="$(dbLocation)" \
                           baseName="$(baseName)" \
                           openAiAccountName="$(openAiAccountName)" \
                           alertEmailAddress="$ALERT_EMAIL" \
                           pgAdminPassword="$(pgAdminPassword)" \
                           authSecret="$(authSecret)" \
                           authSecretDev="$(authSecretDev)" \
                        --query "properties.outputs" -o json | tee "$(Build.ArtifactStagingDirectory)/infra-outputs.json"

                - publish: '$(Build.ArtifactStagingDirectory)/infra-outputs.json'
                  artifact: infra-outputs
                  displayName: 'Publish deployment outputs (webAppName, keyVaultName, etc.)'

  # -------------------------------------------------------------------------
  # SMOKE TEST = post-deploy verification. Confirms the resources this apply just
  # (re-)provisioned are actually healthy, not just that ARM reported success.
  # Key Vault / PostgreSQL / Azure OpenAI provisioning state is a hard gate
  # (these are always expected healthy right after a successful apply). Web app
  # HTTP reachability is informational only: on the very first-ever infra deploy
  # there is no app code yet (app.yml deploys that separately), so a non-200
  # response there is normal until the app pipeline has run at least once.
  # -------------------------------------------------------------------------
  - stage: SmokeTest
    displayName: 'Post-deploy smoke test'
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: smoke_test
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - download: current
            artifact: infra-outputs
          - task: AzureCLI@2
            displayName: 'Verify provisioned resources are healthy (Pester)'
            inputs:
              azureSubscription: 'cityops-azure-service-connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
                Import-Module Pester -RequiredVersion 5.6.1
                $container = New-PesterContainer -Path 'infra/tests/Infra.Integration.Tests.ps1' -Data @{
                  OutputsPath       = '$(Pipeline.Workspace)/infra-outputs/infra-outputs.json'
                  ResourceGroup     = '$(resourceGroup)'
                  OpenAiAccountName = '$(openAiAccountName)'
                }
                $config = New-PesterConfiguration
                $config.Run.Container = $container
                $config.Run.Exit = $true
                $config.Output.Verbosity = 'Detailed'
                $config.TestResult.Enabled = $true
                $config.TestResult.OutputFormat = 'NUnitXml'
                $config.TestResult.OutputPath = '$(Build.ArtifactStagingDirectory)/infra-integration-tests.xml'
                Invoke-Pester -Configuration $config
          - task: PublishTestResults@2
            displayName: 'Publish infra integration test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'NUnit'
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/infra-integration-tests.xml'
              testRunTitle: 'Infra integration tests'
