# Shared setup: install the pinned Node.js ($(nodeVersion)) then run `npm ci`.
# Centralises toolchain setup for every job/deployment in app.yml.
parameters:
  - name: installDisplayName
    type: string
    default: 'Install dependencies'

steps:
  - task: UseNode@1
    inputs:
      version: $(nodeVersion)
    displayName: 'Install Node.js'
  - script: |
      set -e
      n=0
      until npm ci; do
        n=$((n + 1))
        # Retries transient registry/proxy errors (e.g. a 503 from the npm feed) — a real
        # lockfile/dependency error fails identically on every attempt, so this only adds
        # delay in that case, not a false pass.
        [ "$n" -ge 3 ] && exit 1
        echo "npm ci failed (attempt $n/3) — retrying in 15s..."
        sleep 15
      done
    displayName: ${{ parameters.installDisplayName }}
