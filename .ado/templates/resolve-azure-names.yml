# Shared step: derive the web app / key vault names by naming convention (deterministic — see
# docs/deployment-guidelines.md §5.3, the "no hardcoding" mechanism). Existence is already
# verified by the VerifyAzureEnv stage (templates/verify-azure-resources.yml) before Deploy_Dev/
# Deploy_Prod ever run, so this is just a plain string computation — no Azure CLI/auth needed.
parameters:
  - name: baseName
    type: string
    default: cityops

steps:
  - bash: |
      set -e
      echo "##vso[task.setvariable variable=webAppName]app-${{ parameters.baseName }}"
      echo "##vso[task.setvariable variable=keyVaultName]kv-${{ parameters.baseName }}"
    displayName: 'Resolve web app / key vault names'
