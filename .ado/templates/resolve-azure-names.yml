# Shared step: derive the web app / key vault names by naming convention instead of storing
# them anywhere (see docs/deployment-guidelines.md §5.3 — the "no hardcoding" mechanism).
# Names are deterministic (main.bicep no longer appends a uniqueString suffix), so this is a
# plain string computation — no Azure CLI/auth needed. Used by both Deploy_Dev and Deploy_Prod
# in app.yml so the naming convention lives in one place.
parameters:
  - name: baseName
    type: string
    default: cityops

steps:
  - bash: |
      set -e
      echo "##vso[task.setvariable variable=webAppName]app-${{ parameters.baseName }}"
      echo "##vso[task.setvariable variable=keyVaultName]kv-${{ parameters.baseName }}"
    displayName: 'Resolve web app / key vault names'
