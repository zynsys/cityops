# CityOps CI (build only)
# CD is intentionally omitted for now — add a Deploy stage once Azure Key Vault and a
# Pipelines Environment exist (see the commented blueprint at the bottom of this file).
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - main

variables:
  nodeVersion: '20.x'

stages:
  # ---------------------------------------------------------------------------
  # BUILD — environment-agnostic. Needs NO runtime config: the Prisma client is
  # lazily instantiated, so `next build` no longer requires DATABASE_URL.
  # Publishes an artifact that a future Deploy stage can consume.
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: 'Build (environment-agnostic)'
    jobs:
      - job: build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build'
            # Intentionally no env: — the build must not depend on runtime config or secrets.

          - task: CopyFiles@2
            displayName: 'Stage build output'
            inputs:
              Contents: |
                .next/**
                public/**
                prisma/**
                package.json
                package-lock.json
                next.config.ts
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: drop

