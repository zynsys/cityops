# CityOps CI/CD — build + test pyramid, then deploy dev (auto) → prod (manual + approval).
# Unit + integration gate every push/PR; e2e runs on PRs and nightly only.
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

parameters:
  # Visual baselines are OS/font-rendering-sensitive, so they must be generated on the CI image
  # (ubuntu-latest), never on a dev machine. Queue the pipeline manually with this set to true to
  # (re)generate them: the UI stage then runs the visual project with --update-snapshots and
  # publishes the PNGs as the 'visual-baselines' artifact. Download it, commit the files under
  # e2e/visual.spec.ts-snapshots/, and re-run normally so the visual tests have a baseline to diff.
  - name: updateVisualBaselines
    displayName: 'Generate & publish visual baselines (does not gate the run)'
    type: boolean
    default: false

trigger:
  - main

pr:
  - main

schedules:
  - cron: '0 2 * * *' # nightly 02:00 UTC — full e2e run
    displayName: Nightly e2e
    branches:
      include:
        - main
    always: true

variables:
  nodeVersion: '22.x'

resources:
  containers:
    # Ephemeral database for integration/e2e. PostGIS image because CityOps uses PostGIS.
    - container: postgis
      image: postgis/postgis:16-3.4
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: cityops_test

stages:
  # ---------------------------------------------------------------------------
  # VERIFY AZURE ENV — fail fast, in its own stage, if the target web app / key vault don't
  # exist yet (e.g. infra not deployed, or deployed under a different baseName/resourceGroup).
  # Runs in parallel with Build_and_UnitTest (no dependsOn) so a missing environment surfaces
  # within seconds rather than after the full build+test pyramid. Deploy_Dev depends on it (and
  # Deploy_Prod depends on Deploy_Dev), so a missing environment is always its own clearly-named
  # stage failure — never buried inside a deploy step's retry/backoff logic.
  # ---------------------------------------------------------------------------
  - stage: VerifyAzureEnv
    displayName: 'Verify Azure environment'
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    variables:
      - group: cityops-env # resourceGroup, baseName
    jobs:
      - job: verify_azure_env
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/verify-azure-resources.yml
            parameters:
              azureServiceConnection: 'cityops-azure-service-connection'
              resourceGroup: '$(resourceGroup)'
              baseName: '$(baseName)'

  # ---------------------------------------------------------------------------
  # BUILD + UNIT — fast gate on every push/PR. Environment-agnostic build
  # (lazy Prisma), plus unit tests which need no external services.
  # ---------------------------------------------------------------------------
  - stage: Build_and_UnitTest
    displayName: 'Build & Unit tests'
    jobs:
      - job: build_unit
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/setup-nodejs.yml

          - script: mkdir -p reports && npm run lint:report
            displayName: 'Lint'

          - task: PublishTestResults@2
            displayName: 'Publish lint results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'reports/lint-results.xml'
              testRunTitle: 'Lint'

          - script: mkdir -p reports/sarif && npm run lint:sarif
            displayName: 'Lint (SARIF report)'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish lint SARIF log (Scans tab)'
            condition: succeededOrFailed()
            inputs:
              targetPath: 'reports/sarif'
              artifact: CodeAnalysisLogs

          - script: |
              set +e
              npm audit --audit-level=high
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "##vso[task.logissue type=warning]Dependency audit returned exit code $rc (warn-only for now)."
              fi
              exit 0
            displayName: 'Dependency vulnerability audit (warn-only)'

          - script: |
              set +e
              npm run check:duplication
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "##vso[task.logissue type=warning]Code duplication exceeds the 5% threshold (warn-only for now)."
              fi
              exit 0
            displayName: 'Code duplication check (warn-only, jscpd)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish duplication report'
            condition: succeededOrFailed()
            inputs:
              targetPath: 'reports/jscpd'
              artifact: jscpd-report

          - script: mkdir -p reports && npm run test:unit -- --coverage --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml
            displayName: 'Unit tests'

          - task: PublishTestResults@2
            displayName: 'Publish unit results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'reports/unit.xml'
              testRunTitle: 'Unit'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)'

          - script: |
              node -e "const t=require('./coverage/coverage-summary.json').total.lines.pct; const min=60; console.log('Line coverage (unit scope): '+t+'% — target '+min+'%'); if(t<min){ console.log('##vso[task.logissue type=warning]Coverage '+t+'% is below the '+min+'% target'); }"
            displayName: 'Coverage gate (warn-only, target 60%)'
            condition: succeededOrFailed()
            continueOnError: true

          - script: npm run build
            displayName: 'Build'
            # Intentionally no env: — the build must not depend on runtime config or secrets.

          - script: |
              set +e
              npm run check:bundle-size
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "##vso[task.logissue type=warning]Client JS bundle exceeds the size-limit budget (warn-only for now)."
              fi
              exit 0
            displayName: 'Bundle size check (warn-only, size-limit)'

          - script: |
              bash scripts/app/assemble-package.sh "$(Build.ArtifactStagingDirectory)"
            displayName: 'Assemble and validate standalone deploy package'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: drop

  # ---------------------------------------------------------------------------
  # INTEGRATION — runs against an ephemeral PostGIS service. Gates push/PR.
  # ---------------------------------------------------------------------------
  - stage: IntegrationTest
    displayName: 'Integration tests'
    dependsOn: Build_and_UnitTest
    condition: succeeded()
    jobs:
      - job: integration
        pool:
          vmImage: ubuntu-latest
        services:
          postgis: postgis
        variables:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/cityops_test'
        steps:
          - template: templates/setup-nodejs.yml

          - script: |
              for i in $(seq 1 30); do
                (exec 3<>/dev/tcp/localhost/5432) >/dev/null 2>&1 && { echo "PostgreSQL is up"; break; }
                echo "waiting for postgres ($i)…"; sleep 2
              done
            displayName: 'Wait for PostgreSQL'

          - script: npm run db:migrate:deploy
            displayName: 'Apply migrations'

          - script: mkdir -p reports && npm run test:integration -- --coverage --reporter=default --reporter=junit --outputFile.junit=reports/integration.xml
            displayName: 'Integration tests'

          - task: PublishTestResults@2
            displayName: 'Publish integration results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'reports/integration.xml'
              testRunTitle: 'Integration'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage (integration)'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)'

  # ---------------------------------------------------------------------------
  # E2E — Playwright against the built app. Runs on PRs (pre-merge safety net),
  # the nightly schedule (health check), and manual runs (pre-prod promotion) —
  # NOT on every push to main, to keep the continuous dev-deploy path fast.
  # ---------------------------------------------------------------------------
  - stage: E2ETest
    displayName: 'E2E tests'
    dependsOn: IntegrationTest
    condition: and(succeeded(), in(variables['Build.Reason'], 'PullRequest', 'Manual', 'Schedule'))
    jobs:
      - job: e2e
        pool:
          vmImage: ubuntu-latest
        services:
          postgis: postgis
        variables:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/cityops_test'
          NEXTAUTH_URL: 'http://localhost:3000'
          # Throwaway 32+ char value for ephemeral CI only — NOT a real secret.
          AUTH_SECRET: 'ci-e2e-nonsecret-placeholder-0123456789'
          CI: 'true'
        steps:
          - template: templates/setup-nodejs.yml

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright browser'

          - script: |
              for i in $(seq 1 30); do
                (exec 3<>/dev/tcp/localhost/5432) >/dev/null 2>&1 && { echo "PostgreSQL is up"; break; }
                echo "waiting for postgres ($i)…"; sleep 2
              done
            displayName: 'Wait for PostgreSQL'

          - script: npm run db:migrate:deploy && npm run db:seed
            displayName: 'Migrate & seed'

          - script: npm run build
            displayName: 'Build app'

          - script: npm run test:e2e
            displayName: 'Playwright e2e'
            # playwright.config starts `npm run start` in CI and waits for http://localhost:3000.

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright report'
            condition: succeededOrFailed()
            inputs:
              targetPath: 'playwright-report'
              artifact: playwright-report

  # ---------------------------------------------------------------------------
  # UI TESTS — accessibility (axe-core), visual regression (screenshot diffing), and
  # cross-browser/responsive (firefox/webkit/mobile viewport) checks. Runs in parallel with
  # E2ETest (same dependsOn/condition) — separated from it because these have different failure
  # semantics: a visual diff often means "UI changed on purpose, approve a new baseline" rather
  # than "the app is broken", so it shouldn't share a stage with the hard functional gate.
  # Visual baselines are OS/font-rendering-sensitive — generated once in CI (see
  # docs/deployment-guidelines.md §11.8), not on a local dev machine.
  # ---------------------------------------------------------------------------
  - stage: UITest
    displayName: 'UI tests (a11y, visual, cross-browser)'
    dependsOn: IntegrationTest
    condition: and(succeeded(), in(variables['Build.Reason'], 'PullRequest', 'Manual', 'Schedule'))
    jobs:
      - job: ui_test
        pool:
          vmImage: ubuntu-latest
        services:
          postgis: postgis
        variables:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/cityops_test'
          NEXTAUTH_URL: 'http://localhost:3000'
          # Throwaway 32+ char value for ephemeral CI only — NOT a real secret.
          AUTH_SECRET: 'ci-e2e-nonsecret-placeholder-0123456789'
          CI: 'true'
        steps:
          - template: templates/setup-nodejs.yml

          - script: npx playwright install --with-deps chromium firefox webkit
            displayName: 'Install Playwright browsers'

          - script: |
              for i in $(seq 1 30); do
                (exec 3<>/dev/tcp/localhost/5432) >/dev/null 2>&1 && { echo "PostgreSQL is up"; break; }
                echo "waiting for postgres ($i)…"; sleep 2
              done
            displayName: 'Wait for PostgreSQL'

          - script: npm run db:migrate:deploy && npm run db:seed
            displayName: 'Migrate & seed'

          - script: npm run build
            displayName: 'Build app'

          - ${{ if eq(parameters.updateVisualBaselines, true) }}:
              - script: npx playwright test --project=visual --update-snapshots
                displayName: 'Generate visual baselines (--update-snapshots)'
              - task: PublishPipelineArtifact@1
                displayName: 'Publish generated visual baselines'
                inputs:
                  targetPath: 'e2e/visual.spec.ts-snapshots'
                  artifact: visual-baselines

          - ${{ if eq(parameters.updateVisualBaselines, false) }}:
              - script: npm run test:ui
                displayName: 'Playwright UI tests (a11y + visual + cross-browser)'
                # playwright.config starts `npm run start` in CI and waits for http://localhost:3000.

          - task: PublishPipelineArtifact@1
            displayName: 'Publish UI test report'
            condition: succeededOrFailed()
            inputs:
              targetPath: 'playwright-report'
              artifact: ui-test-report

  # ---------------------------------------------------------------------------
  # DEPLOY (Dev slot) — deploy the built app to the 'dev' slot and migrate the
  # dev database (cityops_dev). Gated by the 'dev' environment (no approval — fast
  # continuous feedback).
  #
  # NO HARDCODING: resourceGroup/baseName come from the 'cityops-env' Library variable group;
  # webAppName/keyVaultName are never stored anywhere — they're resolved at deploy time by
  # naming convention (main.bicep always names them 'app-<baseName>-*' / 'kv-<baseName>-*' in the
  # single resource group, baseName also from 'cityops-env'), so a re-provisioned or renamed
  # environment never requires touching this YAML. The service connection name IS a literal below
  # ('cityops-azure-service-connection') rather than '$(azureServiceConnection)' — ADO's static resource-authorization
  # check can't resolve a variable-group-sourced macro for 'azureSubscription:' inputs (it checks
  # the literal unexpanded string), so it must be a compile-time-known value. If you rename the
  # service connection, update it here too (see docs/deployment-guidelines.md §5.3).
  #
  # PREREQUISITES (one-time — see docs/deployment-guidelines.md §3):
  #   1. ARM service connection named 'cityops-azure-service-connection' (see above), whose SP has Contributor on
  #      the resource group and Key Vault Secrets User is granted by Bicep.
  #   2. Variable group 'cityops-env' (Library, plain vars): resourceGroup, baseName.
  #   3. Pipelines Environments 'dev' (no approval) and 'prod' (approval check).
  # ---------------------------------------------------------------------------
  - stage: Deploy_Dev
    displayName: 'Deploy to Dev slot'
    dependsOn:
      - Build_and_UnitTest
      - IntegrationTest
      - VerifyAzureEnv
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    variables:
      - group: cityops-env # resourceGroup, baseName
      - name: devSlotName
        value: dev
    jobs:
      - deployment: deploy_dev
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/setup-nodejs.yml
                  parameters:
                    installDisplayName: 'Install deps (Prisma CLI)'
                - template: templates/resolve-azure-names.yml
                  parameters:
                    baseName: '$(baseName)'
                - task: AzureKeyVault@2
                  displayName: 'Fetch dev DB secret'
                  inputs:
                    azureSubscription: 'cityops-azure-service-connection'
                    KeyVaultName: '$(keyVaultName)'
                    SecretsFilter: 'DATABASE-URL-DEV'
                    RunAsPreJob: false
                - script: npm run db:migrate:deploy
                  displayName: 'Migrate cityops_dev'
                  env:
                    DATABASE_URL: $(DATABASE-URL-DEV)
                - script: npm run db:seed
                  displayName: 'Seed cityops_dev (idempotent upserts)'
                  env:
                    DATABASE_URL: $(DATABASE-URL-DEV)
                - download: current
                  artifact: drop
                - task: AzureWebApp@1
                  displayName: 'Deploy to dev slot'
                  inputs:
                    azureSubscription: 'cityops-azure-service-connection'
                    appType: webAppLinux
                    appName: '$(webAppName)'
                    resourceGroupName: '$(resourceGroup)'
                    deployToSlotOrASE: true
                    slotName: '$(devSlotName)'
                    package: '$(Pipeline.Workspace)/drop'
                    startUpCommand: 'node server.js'
                - template: templates/smoke-test.yml
                  parameters:
                    url: 'https://$(webAppName)-$(devSlotName).azurewebsites.net/api/health'
                    displayName: 'Smoke test dev slot (/api/health)'

  # ---------------------------------------------------------------------------
  # ZAP SCAN — OWASP ZAP baseline (passive) DAST scan against the just-deployed dev slot.
  # App-pipeline only: unlike the infra pipeline (which never deploys app code), this is the
  # only place a real, scannable app exists (see docs/deployment-guidelines.md §11.7.3).
  # Warn-only, like lint/npm audit/jscpd/bundle-size elsewhere in this pipeline (`-I` tells
  # zap-baseline.py not to fail on WARN-level alerts) — a first run is expected to surface
  # pre-existing findings that shouldn't block deploys immediately. Does NOT gate Deploy_Prod.
  # ---------------------------------------------------------------------------
  - stage: ZapScan
    displayName: 'OWASP ZAP baseline scan (dev slot)'
    dependsOn: Deploy_Dev
    condition: succeeded()
    variables:
      - group: cityops-env # baseName
    jobs:
      - job: zap_scan
        pool:
          vmImage: ubuntu-latest
        steps:
          # Checked out because resolve-azure-names.yml runs a repository script.
          - checkout: self
          - template: templates/resolve-azure-names.yml
            parameters:
              baseName: '$(baseName)'
          - script: |
              set +e
              mkdir -p "$(Build.ArtifactStagingDirectory)/zap"
              docker run --rm -v "$(Build.ArtifactStagingDirectory)/zap:/zap/wrk:rw" \
                -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                -t "https://$(webAppName)-dev.azurewebsites.net" \
                -m 5 -r zap-baseline-report.html -J zap-baseline-report.json -I
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "##vso[task.logissue type=warning]OWASP ZAP baseline scan reported a problem (exit $status) — see the published report."
              fi
              exit 0
            displayName: 'OWASP ZAP baseline scan'
          - task: PublishPipelineArtifact@1
            displayName: 'Publish ZAP baseline report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/zap'
              artifact: zap-baseline-report

  # ---------------------------------------------------------------------------
  # DEPLOY (Production) — migrate the prod DB (cityops), then SWAP dev → production
  # for a zero-downtime release (rollback = swap back). Gated by 'prod' approval AND
  # only runs on a manually-triggered pipeline run (Build.Reason == 'Manual') — that is
  # the only trigger where E2ETest also runs in the SAME run, so production can never
  # deploy without E2E passing, without E2E running on every ordinary push. UITest gates
  # it the same way (also only guaranteed to run on a Manual trigger).
  # To promote to prod: Pipelines → app → Run pipeline (manually) on main.
  # Slot-sticky DATABASE_URL/AUTH_SECRET/NEXTAUTH_URL keep each slot pointed at its own
  # DB and its own Auth.js secret, so a swap never leaks dev config into prod or vice versa.
  # ---------------------------------------------------------------------------
  - stage: Deploy_Prod
    displayName: 'Deploy to Production (swap)'
    dependsOn:
      - Deploy_Dev
      - E2ETest
      - UITest
    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
    lockBehavior: sequential # exclusive-lock check on the 'prod' Environment (§11.2) serializes prod deploys
    variables:
      - group: cityops-env # resourceGroup, baseName
      - name: devSlotName
        value: dev
    jobs:
      - deployment: deploy_prod
        environment: prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/setup-nodejs.yml
                  parameters:
                    installDisplayName: 'Install deps (Prisma CLI)'
                - template: templates/resolve-azure-names.yml
                  parameters:
                    baseName: '$(baseName)'
                - task: AzureKeyVault@2
                  displayName: 'Fetch prod DB secret'
                  inputs:
                    azureSubscription: 'cityops-azure-service-connection'
                    KeyVaultName: '$(keyVaultName)'
                    SecretsFilter: 'DATABASE-URL'
                    RunAsPreJob: false
                - script: npm run db:migrate:deploy
                  displayName: 'Migrate cityops (prod)'
                  env:
                    DATABASE_URL: $(DATABASE-URL)
                - script: npm run db:seed
                  displayName: 'Seed cityops (idempotent upserts — remove once real data exists)'
                  env:
                    DATABASE_URL: $(DATABASE-URL)
                - task: AzureAppServiceManage@0
                  displayName: 'Swap dev → production'
                  inputs:
                    azureSubscription: 'cityops-azure-service-connection'
                    action: 'Swap Slots'
                    webAppName: '$(webAppName)'
                    resourceGroupName: '$(resourceGroup)'
                    sourceSlot: '$(devSlotName)'
                - template: templates/smoke-test.yml
                  parameters:
                    url: 'https://$(webAppName).azurewebsites.net/api/health'
                    displayName: 'Smoke test production (/api/health)'
