# CityOps — CLASSIC-style BUILD pipeline (build only)
# Demo of the older Build + Release split: this pipeline ONLY builds and publishes
# an artifact. A Classic Release pipeline (Releases hub, UI-defined) consumes the
# 'drop' artifact and performs the deployment with its own stages/approvals.
#
# Pair with: Pipelines → Releases → New release pipeline → Artifact source = this build.
#
# Manual trigger keeps this separate from the modern multi-stage pipeline
# (.ado/modern/app.yml) so both can coexist during the demo without double-deploying.
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '24.x'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build
    displayName: 'Build'
    # Environment-agnostic: no runtime config needed (Prisma client is lazy).

  - script: |
      set -e
      APP="$(Build.ArtifactStagingDirectory)"
      # App Service starts `node server.js` from /home/site/wwwroot, so flatten
      # the standalone directory into the artifact root rather than publishing
      # it under .next/standalone.
      cp -r .next/standalone/. "$APP/"
      mkdir -p "$APP/.next"
      cp -r .next/static "$APP/.next/static"
      cp -r public "$APP/public"
      test -f "$APP/server.js"
      test -d "$APP/.next/static"
      test -d "$APP/public"
    displayName: 'Assemble and validate standalone deploy package'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifact (consumed by Classic Release)'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'

  - script: |
      set -e
      # Standalone bundle excludes Prisma CLI + migration SQL, so ship them in a
      # separate bundle the Classic Release runs `npm ci && db:migrate:deploy` against.
      MIG="$(Agent.TempDirectory)/migrations"
      rm -rf "$MIG"
      mkdir -p "$MIG"
      cp -r prisma "$MIG/prisma"
      cp package.json package-lock.json prisma.config.ts "$MIG/"
      test -f "$MIG/package-lock.json"
      test -f "$MIG/prisma.config.ts"
      test -d "$MIG/prisma/migrations"
    displayName: 'Assemble and validate DB migration bundle'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish migration bundle (consumed by Classic Release)'
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/migrations'
      ArtifactName: 'migrations'
      publishLocation: 'Container'
